name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name hcom --org io.github.tylenoler .
      - name: Verify Rust core
        run: |
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo check --manifest-path core/Cargo.toml
      - name: Locate Cargo for CMake
        run: |
          $cargo = (Get-Command cargo).Source
          Write-Host "cargo resolved to $cargo"
          "HCOM_CARGO_EXECUTABLE=$cargo" | Add-Content -Path $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path .tooling | Out-Null
          Set-Content -Path .tooling/cargo-executable.txt -Value $cargo -NoNewline
      - name: Verify Flutter shell
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --no-tree-shake-icons
